[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["python_sim"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: line length — handled by formatter, noisy in teaching code.
# E701/E702: compact one-liners and semicolons are intentional in python_sim/engine.py
# to keep regulatory rules visible at a glance.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
